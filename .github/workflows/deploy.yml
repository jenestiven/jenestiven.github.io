# Compila el sitio con Astro y lo publica en GitHub Pages en cada push a main.
#
# Requisitos en el repositorio (Settings):
#   - Pages → Build and deployment → Source: "GitHub Actions".
#   - Secrets and variables → Actions → secreto PUBLIC_MAPBOX_TOKEN (token pk. de Mapbox,
#     restringido por URL a https://jenestiven.github.io).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, el anterior en curso se termina igual.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          PUBLIC_MAPBOX_TOKEN: ${{ secrets.PUBLIC_MAPBOX_TOKEN }}
        run: |
          if [ -z "$PUBLIC_MAPBOX_TOKEN" ]; then
            echo "::error::Falta el secreto PUBLIC_MAPBOX_TOKEN: sin él el mapa no carga."
            exit 1
          fi
          pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
